name: Hosted stewardship

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Explicitly eligible repository to inspect
        required: true
        type: choice
        options:
          - ctrl-alt-keith/ai-workflow-enforcement
      mode:
        description: Stop at evidence or deliver one review-ready proposal
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - propose
      strategy:
        description: Fixed stewardship strategy to execute
        required: true
        default: docs-drift
        type: choice
        options:
          - docs-drift
          - agents-startup-routing
      target_ref:
        description: Optional branch, tag, or commit to inspect in dry-run only; blank uses the default branch
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-stewardship-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  steward:
    name: Run selected stewardship strategy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the exact engine revision
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: stewardship-engine
          persist-credentials: false

      - name: Set up Python
        id: setup_python
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate repository-scoped read identity
        id: read_auth
        if: steps.setup_python.outcome == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WORKFLOW_DRIFT_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOW_DRIFT_APP_PRIVATE_KEY }}
          owner: ctrl-alt-keith
          repositories: ${{ inputs.repository }}
          permission-metadata: read
          permission-contents: read

      - name: Generate repository-scoped delivery identity
        id: write_auth
        if: steps.setup_python.outcome == 'success' && inputs.mode == 'propose' && inputs.target_ref == ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.STEWARDSHIP_WRITE_APP_CLIENT_ID }}
          private-key: ${{ secrets.STEWARDSHIP_WRITE_APP_PRIVATE_KEY }}
          owner: ctrl-alt-keith
          repositories: ${{ inputs.repository }}
          permission-metadata: read
          permission-contents: write
          permission-pull-requests: write

      - name: Execute the shared stewardship pipeline
        id: execute
        if: steps.setup_python.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ github.workspace }}/stewardship-engine
        shell: bash
        env:
          STEWARDSHIP_READ_TOKEN: ${{ steps.read_auth.outputs.token }}
          STEWARDSHIP_WRITE_TOKEN: ${{ steps.write_auth.outputs.token }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          python3 -m enforcement.stewardship.cli \
            --repository "${{ inputs.repository }}" \
            --mode "${{ inputs.mode }}" \
            --strategy "${{ inputs.strategy }}" \
            --target-ref "${TARGET_REF}" \
            --run-identifier "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --engine-revision "${GITHUB_SHA}" \
            --workspace "${RUNNER_TEMP}/hosted-stewardship-workspace" \
            --evidence-dir "${RUNNER_TEMP}/hosted-stewardship-evidence"

      - name: Upload durable stewardship evidence
        id: upload
        if: always() && !cancelled() && steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: hosted-stewardship-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-stewardship-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Enforce the terminal result
        if: always() && !cancelled()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_PYTHON_OUTCOME: ${{ steps.setup_python.outcome }}
          EXECUTION_OUTCOME: ${{ steps.execute.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          if [[ "$CHECKOUT_OUTCOME" != "success" || "$SETUP_PYTHON_OUTCOME" != "success" ]]; then
            printf 'The exact engine checkout or runtime setup failed.\n' >&2
            exit 1
          fi
          if [[ "$UPLOAD_OUTCOME" != "success" ]]; then
            printf 'The durable evidence artifact could not be retained.\n' >&2
            exit 1
          fi
          if [[ "$EXECUTION_OUTCOME" != "success" ]]; then
            printf 'The receipt records a blocked or failed stewardship run.\n' >&2
            exit 1
          fi
          printf 'The stewardship receipt records a successful terminal state.\n'
